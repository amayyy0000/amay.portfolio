<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 2 – Probability</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --card:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.16);
  --blue:#38bdf8;
  --violet:#a78bfa;
  --pink:#f472b6;
  --text:#e6eef8;
  --bg1:#04263a;
  --bg2:#0b1b3a;
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--text);
  overflow:auto;
}

/* ===== BACKGROUND ===== */
canvas#statsBG{
  position:fixed;
  inset:0;
  z-index:-2;
}

.bg-overlay{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(56,189,248,.10), transparent 50%),
    radial-gradient(circle at 85% 75%, rgba(167,139,250,.10), transparent 50%),
    linear-gradient(180deg, rgba(2,6,23,.35), transparent 45%);
  z-index:-1;
  pointer-events:none;
}

/* CONTENT */
section{
  max-width:1300px;
  margin:auto;
  padding:80px 30px;
}

h2{
  font-size:48px;
  text-align:center;
  background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:70px;
}

.card{
  background:var(--card);
  backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:46px;
  margin-bottom:55px;
  box-shadow:0 18px 45px rgba(2,6,23,.45);
}

.card h3{
  font-size:30px;
  margin-bottom:18px;
}

p,li{
  color:#dbeafe;
  line-height:1.9;
  font-size:16.5px;
}

ul{margin-top:14px;}

details{
  margin-top:22px;
  background:rgba(255,255,255,0.06);
  border-radius:14px;
  padding:18px 22px;
  border:1px solid var(--border);
}

details[open]{
  box-shadow:0 0 22px rgba(56,189,248,.45);
}

summary{
  cursor:pointer;
  font-weight:600;
  color:var(--blue);
  font-size:17px;
}

details p{
  margin-top:14px;
  color:#f1f5f9;
}

@media(max-width:820px){
  section{padding:40px 18px;}
  h2{font-size:36px;}
  .card{padding:28px;}
}
</style>
</head>

<body>

<canvas id="statsBG"></canvas>
<div class="bg-overlay"></div>

<section>
<h2>Chapter 2 – Probability</h2>

<!-- ================= CONTENT START ================= -->

<!-- (CONTENT UNCHANGED – SAME AS YOUR ORIGINAL) -->

<!-- ================= CONTENT END ================= -->

</section>

<script>
const canvas = document.getElementById("statsBG");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const points=[];
const COUNT=80;

for(let i=0;i<COUNT;i++){
  points.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    vx:(Math.random()-0.5)*0.3,
    vy:(Math.random()-0.5)*0.3
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<COUNT;i++){
    for(let j=i+1;j<COUNT;j++){
      const dx=points[i].x-points[j].x;
      const dy=points[i].y-points[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){
        ctx.strokeStyle="rgba(124,58,237,0.08)";
        ctx.beginPath();
        ctx.moveTo(points[i].x,points[i].y);
        ctx.lineTo(points[j].x,points[j].y);
        ctx.stroke();
      }
    }
  }

  points.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>canvas.width) p.vx*=-1;
    if(p.y<0||p.y>canvas.height) p.vy*=-1;
    ctx.fillStyle="rgba(56,189,248,0.85)";
    ctx.beginPath();
    ctx.arc(p.x,p.y,2.3,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
